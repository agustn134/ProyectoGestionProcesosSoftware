services:
  mariadb:
    image: mariadb:11.4-noble
    ports:
      - "127.0.0.1:3297:3306"
    environment:
      MARIADB_DATABASE: dbgestor
      MARIADB_USER: gestor
      MARIADB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Define DB_ROOT_PASSWORD en .env}
    volumes:
      - gestor_data:/var/lib/mysql
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
volumes:
  gestor_data:
